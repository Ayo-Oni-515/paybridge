spring:
  application:
    name: paybridge
  datasource:
    url: jdbc:postgresql://localhost:5432/paybridge
    username: postgres
    password: 12345678
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
